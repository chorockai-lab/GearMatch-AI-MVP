name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: TypeScript
        run: npm run typecheck
      - name: ESLint
        run: npm run lint
      - name: Animal Identity test
        run: npm run test:identity
      - name: Onboarding guard test
        run: npm run test:onboarding
      - name: Stats test
        run: npm run test:stats
      - name: ITEMS test
        run: npm run test:items
      - name: Analytics (PostHog) policy test
        run: npm run test:analytics
      - name: Migrations + RLS + analytics + ITEMS SQL (PGlite)
        run: npm run verify:sql
      - name: Pixel asset check
        run: npm run check:assets
      - name: Next.js build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
